<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>KrishnaPrep Post Maker</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            background: #f1f5f9;
            color: #111827;
        }

        .header {
            background: linear-gradient(135deg, #1d4ed8, #7c3aed);
            color: white;
            padding: 22px 15px;
            text-align: center;
        }

        .header h1 {
            margin: 0;
            font-size: 28px;
        }

        .header p {
            margin: 7px 0 0;
            opacity: .9;
        }

        .container {
            max-width: 1200px;
            margin: auto;
            padding: 20px;
        }

        /* TYPE SELECTOR */

        .type-selector {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 15px;
            margin-bottom: 25px;
        }

        .type-card {
            background: white;
            border: 2px solid transparent;
            border-radius: 15px;
            padding: 20px 10px;
            text-align: center;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0, 0, 0, .08);
            transition: .2s;
        }

        .type-card:hover {
            transform: translateY(-3px);
        }

        .type-card.active {
            border-color: #2563eb;
            background: #eff6ff;
        }

        .type-card .icon {
            font-size: 35px;
            display: block;
            margin-bottom: 8px;
        }

        .type-card strong {
            font-size: 17px;
        }

        /* LOCKED-FIELD*/
        .locked-field {
            background: #f1f5f9;
            color: #1d4ed8;
            font-weight: bold;
            cursor: not-allowed;
            border: 1px solid #94a3b8;
        }

        /* EDITOR */

        .editor {
            display: grid;
            grid-template-columns: 380px 1fr;
            gap: 25px;
            align-items: start;
        }

        .panel {
            background: white;
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, .08);
        }

        .panel h2 {
            margin-top: 0;
            font-size: 20px;
        }

        label {
            display: block;
            font-weight: bold;
            margin-top: 14px;
            margin-bottom: 6px;
        }

        input,
        textarea,
        select {
            width: 100%;
            padding: 11px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            font-size: 14px;
            outline: none;
        }

        textarea {
            min-height: 90px;
            resize: vertical;
        }

        input:focus,
        textarea:focus,
        select:focus {
            border-color: #2563eb;
        }

        button {
            border: 0;
            padding: 12px 16px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            font-size: 14px;
        }

        .download {
            width: 100%;
            margin-top: 18px;
            background: #16a34a;
            color: white;
        }

        .reset {
            width: 100%;
            margin-top: 8px;
            background: #e5e7eb;
            color: #111827;
        }

        /* SIZE */

        .size-info {
            background: #eff6ff;
            padding: 10px;
            border-radius: 8px;
            font-size: 13px;
            color: #1e40af;
        }

        /* POSTER AREA */

        .preview-area {
            display: flex;
            justify-content: center;
            align-items: flex-start;
            overflow: auto;
            padding: 20px;
            background: #dbeafe;
            border-radius: 15px;
            min-height: 600px;
        }

        /* POSTER */

        #poster {
            width: 540px;
            height: 675px;
            background: #ffffff;
            position: relative;
            overflow: hidden;
            box-shadow: 0 10px 35px rgba(0, 0, 0, .2);
            flex-shrink: 0;
        }

        /* WATERMARK */

        .watermark {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            pointer-events: none;
            z-index: 1;
            transform: rotate(-30deg);
        }

        .watermark span {
            font-size: 55px;
            font-weight: 900;
            color: rgba(30, 64, 175, .07);
            white-space: nowrap;
        }

        /* POSTER CONTENT */

        .poster-content {
            position: relative;
            z-index: 2;
            height: 100%;
            display: flex;
            flex-direction: column;
        }

        .poster-header {
            background: linear-gradient(135deg, #1d4ed8, #7c3aed);
            color: white;
            padding: 22px 25px;
            text-align: center;
        }

        .brand {
            font-size: 24px;
            font-weight: 900;
        }

        .poster-date {
            font-size: 13px;
            margin-top: 5px;
            opacity: .9;
        }

        .poster-body {
            padding: 25px;
            flex: 1;
            overflow: hidden;
        }

        .badge {
            display: inline-block;
            background: #dbeafe;
            color: #1d4ed8;
            padding: 7px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
            margin-bottom: 12px;
        }

        .poster-title {
            font-size: 29px;
            line-height: 1.2;
            margin: 5px 0 15px;
            color: #111827;
        }

        .poster-text {
            font-size: 16px;
            line-height: 1.6;
            color: #374151;
            white-space: pre-line;
        }

        .gk-box {
            margin-top: 15px;
            background: #f8fafc;
            border-left: 5px solid #2563eb;
            padding: 14px;
            border-radius: 8px;
        }

        .gk-box strong {
            color: #1d4ed8;
        }

        .gk-list {
            margin: 8px 0 0;
            padding-left: 20px;
            line-height: 1.7;
        }

        .quiz-question {
            background: #eff6ff;
            padding: 15px;
            border-radius: 10px;
            font-size: 18px;
            font-weight: bold;
            line-height: 1.5;
        }

        .options {
            margin-top: 12px;
        }

        .option {
            padding: 10px 12px;
            margin: 7px 0;
            border: 1px solid #cbd5e1;
            border-radius: 7px;
            background: white;
        }

        .answer {
            margin-top: 15px;
            padding: 12px;
            background: #dcfce7;
            color: #166534;
            border-radius: 8px;
            font-weight: bold;
        }

        .source {
            margin-top: 15px;
            font-size: 12px;
            color: #64748b;
        }

        /* HOLIDAY */

        .holiday-box {
            text-align: center;
            background: linear-gradient(135deg, #eff6ff, #f5f3ff);
            padding: 22px 15px;
            border-radius: 14px;
            border: 1px solid #dbeafe;
        }

        .holiday-icon {
            font-size: 55px;
            margin-bottom: 10px;
        }

        .holiday-title {
            font-size: 30px;
            line-height: 1.2;
            margin: 8px 0;
            color: #1d4ed8;
            font-weight: 900;
        }

        .holiday-occasion {
            font-size: 18px;
            font-weight: bold;
            color: #7c3aed;
            margin-bottom: 12px;
        }

        .holiday-date {
            display: inline-block;
            background: #1d4ed8;
            color: white;
            padding: 8px 15px;
            border-radius: 20px;
            font-weight: bold;
            margin-bottom: 15px;
        }

        .holiday-message {
            font-size: 16px;
            line-height: 1.6;
            color: #374151;
        }

        .poster-footer {
            background: #111827;
            color: white;
            padding: 15px 20px;
            text-align: center;
            font-size: 12px;
            line-height: 1.6;
        }

        .poster-footer strong {
            font-size: 14px;
        }

        /* RESPONSIVE */

        @media(max-width:950px) {

            .type-selector {
                grid-template-columns: repeat(3, 1fr);
            }

            .editor {
                grid-template-columns: 1fr;
            }

            .preview-area {
                justify-content: flex-start;
            }
        }

        @media(max-width:600px) {

            .type-selector {
                grid-template-columns: repeat(2, 1fr);
            }

            .container {
                padding: 10px;
            }

            .type-card {
                padding: 15px 5px;
            }

            .type-card .icon {
                font-size: 28px;
            }

            #poster {
                transform-origin: top left;
            }
        }
    </style>
</head>

<body>

    <header class="header">
        <h1>KrishnaPrep Post Maker</h1>
        <p>Create Posts • Static GK • Current Affairs • Quiz • Holidays</p>
    </header>

    <div class="container">

        <!-- TYPE SELECTOR -->

        <div class="type-selector">

            <div class="type-card active" data-type="post">
                <span class="icon">📰</span>
                <strong>Post</strong>
            </div>

            <div class="type-card" data-type="gk">
                <span class="icon">📚</span>
                <strong>Static GK</strong>
            </div>

            <div class="type-card" data-type="current">
                <span class="icon">🗞️</span>
                <strong>Current Affairs</strong>
            </div>

            <div class="type-card" data-type="quiz">
                <span class="icon">❓</span>
                <strong>Quiz</strong>
            </div>

            <!-- NEW HOLIDAY -->

            <div class="type-card" data-type="holiday">
                <span class="icon">🎉</span>
                <strong>Holiday</strong>
            </div>

        </div>


        <div class="editor">

            <!-- LEFT PANEL -->

            <div class="panel">

                <h2>✏️ Create Your Poster</h2>

                <label>Poster Size</label>

                <select id="size">
                    <option value="portrait">Instagram Portrait — 1080 × 1350</option>
                    <option value="square">Instagram Square — 1080 × 1080</option>
                    <option value="story">Instagram Story / WhatsApp — 1080 × 1920</option>
                    <option value="long">Long Poster — 1080 × 1600</option>
                </select>

                <div class="size-info" id="sizeInfo">
                    Current size: 1080 × 1350
                </div>

                <!-- Brand Name And Website -->
                <!-- <label>Website / Brand Name</label>
                <input id="website" value="Krishna Computer Cafe | krishnaprep.in"> -->
                <label>Website / Brand Name 🔒</label>
                <input id="website" value="Krishna Computer Cafe | krishnaprep.in" readonly class="locked-field"
                    title="Website / Brand Name is locked">


                <label>Date</label>
                <input id="date" value="28 August 2026">


                <!-- POST -->

                <div id="postFields">

                    <label>Post Title</label>
                    <input id="postTitle" value="Important Day">

                    <label>Heading</label>
                    <input id="postHeading" value="National Sports Day">

                    <label>Description</label>
                    <textarea
                        id="postDescription">National Sports Day is observed to promote sports, fitness and awareness about the importance of physical activities.</textarea>

                </div>


                <!-- GK -->

                <div id="gkFields" style="display:none;">

                    <label>GK Category</label>
                    <input id="gkCategory" value="STATIC GK">

                    <label>Question</label>
                    <textarea id="gkQuestion">Which is the largest planet in our Solar System?</textarea>

                    <label>Option A</label>
                    <input id="gkA" value="Earth">

                    <label>Option B</label>
                    <input id="gkB" value="Jupiter">

                    <label>Option C</label>
                    <input id="gkC" value="Mars">

                    <label>Option D</label>
                    <input id="gkD" value="Venus">

                    <label>GK Fact / Explanation</label>
                    <textarea id="gkFact">Jupiter is the largest planet in our Solar System.</textarea>

                </div>


                <!-- CURRENT AFFAIRS -->

                <div id="currentFields" style="display:none;">

                    <label>Category</label>
                    <input id="currentCategory" value="NATIONAL AFFAIRS">

                    <label>Current Affairs Title</label>
                    <textarea id="currentTitle">India Advances Major Government Initiatives</textarea>

                    <label>Summary</label>
                    <textarea
                        id="currentSummary">Several important government initiatives remained in focus, reflecting India's focus on development, technology, innovation and youth participation.</textarea>

                    <label>Important Facts</label>
                    <textarea id="currentFacts">Focus: Development and Innovation
Government: Government of India
Area: National Development
Importance: Competitive Examinations</textarea>

                    <label>Source</label>
                    <input id="currentSource" value="Press Information Bureau">

                </div>


                <!-- QUIZ -->

                <div id="quizFields" style="display:none;">

                    <label>Quiz Category</label>
                    <input id="quizCategory" value="DAILY QUIZ">

                    <label>Question</label>
                    <textarea id="quizQuestion">Which planet is known as the Red Planet?</textarea>

                    <label>Option A</label>
                    <input id="quizA" value="Earth">

                    <label>Option B</label>
                    <input id="quizB" value="Mars">

                    <label>Option C</label>
                    <input id="quizC" value="Jupiter">

                    <label>Option D</label>
                    <input id="quizD" value="Venus">

                    <label>Correct Answer</label>
                    <input id="quizAnswer" value="B) Mars">

                    <label>Explanation</label>
                    <textarea
                        id="quizExplanation">Mars is commonly known as the Red Planet because of its reddish appearance.</textarea>

                </div>


                <!-- HOLIDAY -->

                <div id="holidayFields" style="display:none;">

                    <label>Holiday Name</label>
                    <input id="holidayName" value="Raksha Bandhan">

                    <label>Occasion / Type</label>
                    <input id="holidayOccasion" value="Festival">

                    <label>Holiday Date</label>
                    <input id="holidayDate" value="28 August 2026">

                    <label>Holiday Description</label>
                    <textarea
                        id="holidayDescription">Raksha Bandhan is a festival celebrating the bond of love, care and protection between brothers and sisters.</textarea>

                    <label>Greeting / Message</label>
                    <textarea id="holidayMessage">Wishing everyone a very Happy Raksha Bandhan!</textarea>

                </div>


                <label>Footer Contact</label>
                <input id="contact" value="Follow us • Join WhatsApp Group • Instagram">

                <!-- Watermarks -->
                <!-- <label>Watermark Text</label>
                <input id="watermark" value="KRISHNAPREP.IN"> -->
                <label>Watermark Text 🔒</label>
                <input id="watermark" value="krishnaprep.in" readonly class="locked-field"
                    title="Watermark Text is locked">


                <button class="download" onclick="downloadPoster()">
                    📥 Download Poster PNG
                </button>

                <button class="reset" onclick="location.reload()">
                    🔄 Reset
                </button>

            </div>


            <!-- PREVIEW -->

            <div class="preview-area">

                <div id="poster">

                    <div class="watermark">
                        <span id="watermarkText">KRISHNAPREP.IN</span>
                    </div>

                    <div class="poster-content">

                        <div class="poster-header">

                            <div class="brand" id="brand">
                                KRISHNAPREP.IN
                            </div>

                            <div class="poster-date" id="posterDate">
                                28 August 2026
                            </div>

                        </div>


                        <div class="poster-body" id="posterBody">

                            <!-- CONTENT GENERATED BY JS -->

                        </div>


                        <div class="poster-footer">

                            <strong>KRISHNAPREP.IN</strong><br>

                            <span id="posterContact">
                                Follow us • Join WhatsApp Group • Instagram
                            </span>

                        </div>

                    </div>

                </div>

            </div>

        </div>

    </div>


    <!-- HTML2CANVAS -->

    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>


    <script>

        /* ==========================
           GLOBAL VARIABLES
        ========================== */

        let currentType = "post";


        /* ==========================
           TYPE SELECTOR
        ========================== */

        document.querySelectorAll(".type-card").forEach(card => {

            card.addEventListener("click", function () {

                document.querySelectorAll(".type-card")
                    .forEach(c => c.classList.remove("active"));

                this.classList.add("active");

                currentType = this.dataset.type;

                showFields();

                updatePoster();

            });

        });


        /* ==========================
           SHOW FORM FIELDS
        ========================== */

        function showFields() {

            document.getElementById("postFields").style.display =
                currentType === "post" ? "block" : "none";

            document.getElementById("gkFields").style.display =
                currentType === "gk" ? "block" : "none";

            document.getElementById("currentFields").style.display =
                currentType === "current" ? "block" : "none";

            document.getElementById("quizFields").style.display =
                currentType === "quiz" ? "block" : "none";

            document.getElementById("holidayFields").style.display =
                currentType === "holiday" ? "block" : "none";

        }


        /* ==========================
           GET VALUE
        ========================== */

        function value(id) {

            return document.getElementById(id).value;

        }


        /* ==========================
           UPDATE POSTER
        ========================== */

        function updatePoster() {

            document.getElementById("brand").textContent =
                value("website");

            document.getElementById("posterDate").textContent =
                value("date");

            document.getElementById("posterContact").textContent =
                value("contact");

            document.getElementById("watermarkText").textContent =
                value("watermark");


            let html = "";


            /* POST */

            if (currentType === "post") {

                html = `

            <span class="badge">📰 IMPORTANT POST</span>

            <h1 class="poster-title">
                ${escapeHTML(value("postTitle"))}
            </h1>

            <h2>
                ${escapeHTML(value("postHeading"))}
            </h2>

            <p class="poster-text">
                ${escapeHTML(value("postDescription"))}
            </p>

        `;

            }


            /* STATIC GK */

            if (currentType === "gk") {

                html = `

            <span class="badge">
                📚 ${escapeHTML(value("gkCategory"))}
            </span>

            <div class="quiz-question">
                ${escapeHTML(value("gkQuestion"))}
            </div>

            <div class="options">

                <div class="option">
                    <b>A)</b> ${escapeHTML(value("gkA"))}
                </div>

                <div class="option">
                    <b>B)</b> ${escapeHTML(value("gkB"))}
                </div>

                <div class="option">
                    <b>C)</b> ${escapeHTML(value("gkC"))}
                </div>

                <div class="option">
                    <b>D)</b> ${escapeHTML(value("gkD"))}
                </div>

            </div>

            <div class="gk-box">

                <strong>💡 GK FACT</strong>

                <p>
                    ${escapeHTML(value("gkFact"))}
                </p>

            </div>

        `;

            }


            /* CURRENT AFFAIRS */

            if (currentType === "current") {

                let facts = value("currentFacts")
                    .split("\n")
                    .filter(x => x.trim() !== "");

                let factHTML = facts.map(f =>
                    `<li>${escapeHTML(f)}</li>`
                ).join("");

                html = `

            <span class="badge">
                🗞️ ${escapeHTML(value("currentCategory"))}
            </span>

            <h1 class="poster-title">
                ${escapeHTML(value("currentTitle"))}
            </h1>

            <p class="poster-text">
                ${escapeHTML(value("currentSummary"))}
            </p>

            <div class="gk-box">

                <strong>📌 IMPORTANT FACTS</strong>

                <ul class="gk-list">
                    ${factHTML}
                </ul>

            </div>

            <div class="source">
                Source: ${escapeHTML(value("currentSource"))}
            </div>

        `;

            }


            /* QUIZ */

            if (currentType === "quiz") {

                html = `

            <span class="badge">
                ❓ ${escapeHTML(value("quizCategory"))}
            </span>

            <div class="quiz-question">
                ${escapeHTML(value("quizQuestion"))}
            </div>

            <div class="options">

                <div class="option">
                    <b>A)</b> ${escapeHTML(value("quizA"))}
                </div>

                <div class="option">
                    <b>B)</b> ${escapeHTML(value("quizB"))}
                </div>

                <div class="option">
                    <b>C)</b> ${escapeHTML(value("quizC"))}
                </div>

                <div class="option">
                    <b>D)</b> ${escapeHTML(value("quizD"))}
                </div>

            </div>

            <div class="answer">
                ✅ Correct Answer: ${escapeHTML(value("quizAnswer"))}
            </div>

            <div class="gk-box">

                <strong>💡 Explanation</strong>

                <p>
                    ${escapeHTML(value("quizExplanation"))}
                </p>

            </div>

        `;

            }


            /* HOLIDAY */

            if (currentType === "holiday") {

                html = `

            <div class="holiday-box">

                <div class="holiday-icon">
                    🎉
                </div>

                <span class="badge">
                    🗓️ HOLIDAY / FESTIVAL
                </span>

                <h1 class="holiday-title">
                    ${escapeHTML(value("holidayName"))}
                </h1>

                <div class="holiday-occasion">
                    ${escapeHTML(value("holidayOccasion"))}
                </div>

                <div class="holiday-date">
                    📅 ${escapeHTML(value("holidayDate"))}
                </div>

                <p class="holiday-message">
                    ${escapeHTML(value("holidayDescription"))}
                </p>

                <div class="gk-box">

                    <strong>💐 GREETINGS</strong>

                    <p class="poster-text">
                        ${escapeHTML(value("holidayMessage"))}
                    </p>

                </div>

            </div>

        `;

            }


            document.getElementById("posterBody").innerHTML = html;

        }


        /* ==========================
           ESCAPE HTML
        ========================== */

        function escapeHTML(text) {

            return text
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");

        }


        /* ==========================
           SIZE
        ========================== */

        document.getElementById("size").addEventListener("change", function () {

            let poster = document.getElementById("poster");

            let size = this.value;


            if (size === "portrait") {

                poster.style.width = "540px";
                poster.style.height = "675px";

                document.getElementById("sizeInfo").textContent =
                    "Current size: 1080 × 1350";

            }


            if (size === "square") {

                poster.style.width = "540px";
                poster.style.height = "540px";

                document.getElementById("sizeInfo").textContent =
                    "Current size: 1080 × 1080";

            }


            if (size === "story") {

                poster.style.width = "540px";
                poster.style.height = "960px";

                document.getElementById("sizeInfo").textContent =
                    "Current size: 1080 × 1920";

            }


            if (size === "long") {

                poster.style.width = "540px";
                poster.style.height = "800px";

                document.getElementById("sizeInfo").textContent =
                    "Current size: 1080 × 1600";

            }

        });


        /* ==========================
           LIVE UPDATE
        ========================== */

        document.querySelectorAll("input, textarea, select")
            .forEach(element => {

                element.addEventListener("input", updatePoster);
                element.addEventListener("change", updatePoster);

            });


        /* ==========================
           DOWNLOAD PNG
        ========================== */

        async function downloadPoster() {

            const poster = document.getElementById("poster");

            const canvas = await html2canvas(poster, {

                scale: 2,

                useCORS: true,

                backgroundColor: "#ffffff"

            });


            const link = document.createElement("a");

            link.download =
                "KrishnaPrep-" +
                currentType +
                "-" +
                Date.now() +
                ".png";

            link.href = canvas.toDataURL("image/png");

            link.click();

        }


        /* ==========================
           INITIAL LOAD
        ========================== */

        showFields();

        updatePoster();

    </script>

</body>

</html>
